apiVersion: apps/v1
kind: Deployment
metadata:
  name: webrobot-mcp
  namespace: webrobot
  labels:
    app: webrobot-mcp
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: webrobot-mcp
  template:
    metadata:
      labels:
        app: webrobot-mcp
        managed-by: kustomize
        version: v1.0.0
      annotations:
        kubectl.kubernetes.io/restartedAt: "timestamp-placeholder"
    spec:
      imagePullSecrets:
      - name: docker-config
      containers:
      - name: mcp
        image: ghcr.io/webrobot-ltd/webrobot-mcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: MCP_TRANSPORT
          value: "http"
        # demo scope = only /webrobot/api/demo/* exposed, no auth required.
        # To run a per-tenant authenticated MCP, deploy a second instance
        # with MCP_SCOPE=full + WEBROBOT_API_KEY from a Secret.
        - name: MCP_SCOPE
          value: "demo"
        - name: MCP_HOST
          value: "0.0.0.0"
        - name: MCP_PORT
          value: "8080"
        - name: MCP_PATH
          value: "/mcp"
        - name: WEBROBOT_API_ENDPOINT
          value: "https://api.webrobot.eu"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
